<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Prevent aggressive caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cms_dynamic_artist_monetization">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cms_dynamic_artist_monetization</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Version cache busting -->
  <script>
    window.flutterCacheVersion = Date.now();
    // Force browser to reload assets on every deployment
    window.addEventListener('DOMContentLoaded', function() {
      const version = new URLSearchParams(window.location.search).get('v') || Date.now();
      console.log('App version:', version);
    });
  </script>
</head>
<body>
  <script>
    // Add version parameter to main script
    const script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + Date.now();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
